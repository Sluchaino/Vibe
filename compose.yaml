name: vibe-d1

services:
  db:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vibe
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      VIBE_APP_PASSWORD_FILE: /run/secrets/pg_app_password
    secrets:
      - pg_admin_password
      - pg_app_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-vibe.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vibe"]
      interval: 3s
      timeout: 3s
      retries: 20

secrets:
  pg_admin_password:
    file: ./.tools/secrets/pg-admin-password
  pg_app_password:
    file: ./.tools/secrets/pg-app-password

volumes:
  pgdata:
