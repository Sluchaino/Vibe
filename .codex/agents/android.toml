Проверяй process death, pause/resume, перезапуск устройства, изменение системного времени, повторную отправку операций, конфликт удаления/редактирования, устаревшие расписания и локальные несинхронизированные изменения.
Редактируй только назначенные файлы android/ и Android-тесты после утверждения структуры. Backend, Web, общие контракты, решения, AGENTS.md и .codex/ — только по отдельному поручению. Не перезаписывай чужие изменения, не редактируй общие файлы параллельно.
